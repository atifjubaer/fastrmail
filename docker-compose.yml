services:
  fastrmail:
    build:
      context: .
      dockerfile: Dockerfile
    image: fastrmail:latest
    container_name: fastrmail
    restart: unless-stopped
    ports:
      # SMTP Inbound (RFC 5321) - Maps host port 25 to container 2525
      - "${SMTP_PORT:-25}:2525"
      # IMAP4rev2 (RFC 9051) - Maps host port 143 to container 1143
      - "${IMAP_PORT:-143}:1143"
      # HTTP Webmail, Admin Dashboard, REST API & JMAP - Maps host port 8080 to container 8080
      - "${HTTP_PORT:-8080}:8080"
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - FASTRMAIL_DATA_DIR=/app/data
      - FASTRMAIL_BIND_SMTP=0.0.0.0:2525
      - FASTRMAIL_BIND_IMAP=0.0.0.0:1143
      - FASTRMAIL_BIND_HTTP=0.0.0.0:8080
    volumes:
      - ${DATA_PATH:-./fastrmail_data}:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
