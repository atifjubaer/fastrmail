# FastrMail Service Template for Coolify (templates/compose/fastrmail.yaml)
name: FastrMail
description: Enterprise-grade single-binary mail server built in Rust with SMTP, IMAP4rev2, POP3, JMAP, Sieve, and Lucene search.
documentation: https://fastrmail-landing.vercel.app
tags:
  - mail
  - email
  - smtp
  - imap
  - rust
services:
  fastrmail:
    image: ghcr.io/atifjubaer/fastrmail:latest
    ports:
      - "25:2525"
      - "587:2526"
      - "143:1143"
      - "110:1110"
    expose:
      - "8080"
    environment:
      - RUST_LOG=info
      - FASTRMAIL_DATA_DIR=/app/data
      - FASTRMAIL_BIND_SMTP=0.0.0.0:2525
      - FASTRMAIL_BIND_SUBMISSION=0.0.0.0:2526
      - FASTRMAIL_BIND_IMAP=0.0.0.0:1143
      - FASTRMAIL_BIND_POP3=0.0.0.0:1110
      - FASTRMAIL_BIND_HTTP=0.0.0.0:8080
      - FASTRMAIL_HOSTNAME=${SERVICE_FQDN_FASTRMAIL}
      - FASTRMAIL_PRIMARY_DOMAIN=${FASTRMAIL_PRIMARY_DOMAIN:-example.com}
      - FASTRMAIL_ADMIN_USER=${SERVICE_USER_ADMIN:-admin}
      - FASTRMAIL_ADMIN_PASS=${SERVICE_PASSWORD_ADMIN}
    volumes:
      - fastrmail-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
