[package]
name = "fastrmail-jmap"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "JMAP JSON API (RFC 8620/8621) for FastrMail"

[dependencies]
fastrmail-core = { path = "../fastrmail-core" }
fastrmail-store = { path = "../fastrmail-store" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
anyhow = "1"
