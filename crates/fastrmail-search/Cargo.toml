[package]
name = "fastrmail-search"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Tantivy-based full-text search engine for FastrMail"

[dependencies]
fastrmail-core = { path = "../fastrmail-core" }
fastrmail-store = { path = "../fastrmail-store" }
tantivy = "0.22"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
