[package]
name = "fastrmail-smtp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "SMTP inbound listener and outbound delivery queue for FastrMail"

[dependencies]
fastrmail-core = { path = "../fastrmail-core" }
fastrmail-store = { path = "../fastrmail-store" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
