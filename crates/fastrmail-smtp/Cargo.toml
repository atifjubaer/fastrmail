[package]
name = "fastrmail-smtp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "SMTP inbound listener and outbound delivery queue for FastrMail"

[dependencies]
fastrmail-core = { path = "../fastrmail-core" }
fastrmail-store = { path = "../fastrmail-store" }
fastrmail-auth = { path = "../fastrmail-auth" }
fastrmail-search = { path = "../fastrmail-search" }
mail-parser = "0.9"
hickory-resolver = "0.24"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
anyhow = "1"
