[workspace]
members = [
    "crates/fastrmail-binary",
    "crates/fastrmail-smtp",
    "crates/fastrmail-imap",
    "crates/fastrmail-jmap",
    "crates/fastrmail-core",
    "crates/fastrmail-auth",
    "crates/fastrmail-store",
    "crates/fastrmail-search", "crates/fastrmail-pop3",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Atif Jubaer"]
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
