# ==============================================================================
# FastrMail — Dokploy Service Template
# ==============================================================================
# This template defines a one-click deployable service for Dokploy.
# Import this file in Dokploy > Applications > Docker Compose to auto-provision.
#
# Dokploy will auto-detect Traefik labels, set up routing, and provision
# Let's Encrypt TLS certificates for the specified FASTRMAIL_HOSTNAME.
# ==============================================================================

version: "3.8"

services:
  fastrmail:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/atifjubaer/fastrmail:latest
    container_name: fastrmail
    restart: unless-stopped

    # ── Port Exposure ────────────────────────────────────────────────────────
    ports:
      - "${SMTP_PORT:-25}:2525"       # SMTP Inbound (RFC 5321)
      - "${IMAP_PORT:-143}:1143"      # IMAP4rev2 (RFC 9051)
      - "${HTTP_PORT:-8080}:8080"     # HTTP — Webmail, Admin, REST API, JMAP

    # ── Environment Variables (Dokploy auto-fills from UI) ───────────────────
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
      FASTRMAIL_DATA_DIR: "/app/data"
      FASTRMAIL_BIND_SMTP: "0.0.0.0:2525"
      FASTRMAIL_BIND_IMAP: "0.0.0.0:1143"
      FASTRMAIL_BIND_HTTP: "0.0.0.0:8080"
      FASTRMAIL_HOSTNAME: "${FASTRMAIL_HOSTNAME:-mail.example.com}"
      FASTRMAIL_PRIMARY_DOMAIN: "${FASTRMAIL_PRIMARY_DOMAIN:-example.com}"
      FASTRMAIL_ADMIN_USER: "${FASTRMAIL_ADMIN_USER:-admin}"
      FASTRMAIL_ADMIN_PASS: "${FASTRMAIL_ADMIN_PASS:-changeme}"

    # ── Persistent Storage ───────────────────────────────────────────────────
    volumes:
      - fastrmail_data:/app/data

    # ── Networking ───────────────────────────────────────────────────────────
    networks:
      - dokploy-network

    # ── Traefik Labels (Dokploy auto-discovery) ──────────────────────────────
    labels:
      # Enable Traefik routing
      traefik.enable: "true"

      # HTTP Router — Webmail & Admin UI (HTTPS via Let's Encrypt)
      traefik.http.routers.fastrmail-web.rule: "Host(`${FASTRMAIL_HOSTNAME:-mail.example.com}`)"
      traefik.http.routers.fastrmail-web.entrypoints: "websecure"
      traefik.http.routers.fastrmail-web.tls: "true"
      traefik.http.routers.fastrmail-web.tls.certresolver: "letsencrypt"
      traefik.http.services.fastrmail-web.loadbalancer.server.port: "8080"

      # TCP Router — SMTP Inbound (Port 25)
      traefik.tcp.routers.fastrmail-smtp.rule: "HostSNI(`*`)"
      traefik.tcp.routers.fastrmail-smtp.entrypoints: "smtp"
      traefik.tcp.services.fastrmail-smtp.loadbalancer.server.port: "2525"

      # TCP Router — IMAP (Port 143)
      traefik.tcp.routers.fastrmail-imap.rule: "HostSNI(`*`)"
      traefik.tcp.routers.fastrmail-imap.entrypoints: "imap"
      traefik.tcp.services.fastrmail-imap.loadbalancer.server.port: "1143"

      # Dokploy Metadata
      dokploy.service.name: "fastrmail"
      dokploy.service.description: "FastrMail — Enterprise-grade single-binary mail server"
      dokploy.service.icon: "📬"

    # ── Health Check ─────────────────────────────────────────────────────────
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  fastrmail_data:
    driver: local

# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  dokploy-network:
    external: true
